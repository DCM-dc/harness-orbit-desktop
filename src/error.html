<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'">
    <title>Harness Orbit · 启动失败</title>
    <link rel="stylesheet" href="error.css">
  </head>
  <body>
    <main class="error-card">
      <img src="assets/orbit-mark.svg" alt="" aria-hidden="true">
      <p class="eyebrow">HARNESS ENGINE</p>
      <h1>引擎暂时没有响应</h1>
      <p class="message" id="message">请重试，或打开日志查看详细信息。</p>
      <div class="actions">
        <button class="primary" id="retry">重新启动</button>
        <button id="workspace">选择工作区</button>
        <button id="logs">查看日志</button>
      </div>
    </main>
    <script src="error.js"></script>
  </body>
</html>
